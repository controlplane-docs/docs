name: PR Slack Notification

# pull_request_target runs the version of this file on the DEFAULT BRANCH,
# in the base repo's context, with secrets available — which is what makes
# fork PRs work. It is only safe because nothing below checks out or runs
# code from the PR. Never add actions/checkout to this file.
on:
  pull_request_target:
    types: [opened, ready_for_review, review_requested, closed]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write
  deployments: read

concurrency:
  group: pr-slack-${{ github.event.pull_request.number }}-${{ github.event.action }}
  cancel-in-progress: false

jobs:
  # ── Parent message: posted once, when the PR becomes reviewable ──
  root:
    if: >-
      github.event.action == 'ready_for_review' ||
      (github.event.action == 'opened' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate Slack channel
        env:
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_USER_MAP: ${{ vars.SLACK_USER_MAP }}
        run: |
          set -euo pipefail

          if [ -z "${SLACK_CHANNEL_ID}" ]; then
            echo "::error::SLACK_CHANNEL_ID repository or organization variable is not set."
            exit 1
          fi

          case "$SLACK_CHANNEL_ID" in
            C*|G*|D*) ;;
            *)
              echo "::warning::SLACK_CHANNEL_ID should normally be a Slack channel ID, such as C... for public channels or G... for private channels, not a channel name."
              ;;
          esac

          if [ -n "${SLACK_USER_MAP}" ] && ! jq -e 'type == "object"' >/dev/null <<< "$SLACK_USER_MAP"; then
            echo "::error::SLACK_USER_MAP must be a valid JSON object."
            exit 1
          fi

      - name: Escape the title
        id: meta
        env:
          SLACK_USER_MAP: ${{ vars.SLACK_USER_MAP }}
        run: |
          set -euo pipefail

          slack_escape() {
            sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/\\/\\\\/g; s/"/\\"/g'
          }

          slack_user() {
            login="$1"
            slack_id=$(jq -r --arg login "$login" '.[$login] // empty' <<< "${SLACK_USER_MAP:-'{}'}")
            if [ -n "$slack_id" ]; then
              printf '<@%s>\n' "$slack_id"
            else
              printf '*%s*\n' "$(printf '%s\n' "$login" | slack_escape)"
            fi
          }

          # Read from the event file, never interpolate the title into shell
          title=$(jq -r '.pull_request.title' "$GITHUB_EVENT_PATH" \
            | tr -d '\r\n' | slack_escape)
          echo "title=$title" >> "$GITHUB_OUTPUT"

          author=$(jq -r '.pull_request.user.login' "$GITHUB_EVENT_PATH")
          echo "author=$(slack_user "$author")" >> "$GITHUB_OUTPUT"

          # Label fork PRs — Mintlify doesn't build previews from forks
          if [ "$(jq -r '.pull_request.head.repo.fork' "$GITHUB_EVENT_PATH")" = "true" ]; then
            src=$(jq -r '.pull_request.head.repo.full_name' "$GITHUB_EVENT_PATH" | slack_escape)
            echo "fork= · :fork_and_knife: fork \`${src}\` — no preview" >> "$GITHUB_OUTPUT"
          else
            echo "fork=" >> "$GITHUB_OUTPUT"
          fi

      - name: Post to Slack
        id: post
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: "${{ vars.SLACK_CHANNEL_ID }}"
            text: "Ready for review: ${{ steps.meta.outputs.title }}"
            unfurl_links: false
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: ":eyes: *<${{ github.event.pull_request.html_url }}|${{ steps.meta.outputs.title }}>*"
              - type: context
                elements:
                  - type: mrkdwn
                    text: "opened by ${{ steps.meta.outputs.author }} · `${{ github.repository }}` #${{ github.event.pull_request.number }} · +${{ github.event.pull_request.additions }}/-${{ github.event.pull_request.deletions }}${{ steps.meta.outputs.fork }}"

      - name: Stash the thread ts on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -f body="<!-- slack-thread-ts:${{ steps.post.outputs.ts }} -->"

      - name: Wait for the Mintlify preview
        id: preview
        if: github.event.pull_request.head.repo.fork == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          url=""

          # Mintlify deploys to the "staging" environment; poll up to ~3 min
          for _ in $(seq 1 12); do
            dep=$(gh api "repos/$REPO/deployments?environment=staging&per_page=100" \
              | jq -r --arg sha "$HEAD_SHA" '[.[] | select(.sha == $sha)] | first | .id // empty')
            if [ -n "$dep" ]; then
              url=$(gh api "repos/$REPO/deployments/$dep/statuses" \
                | jq -r '[.[] | select(.state == "success")] | first | .environment_url // empty')
              [ -n "$url" ] && break
            fi
            sleep 15
          done

          # Fallback: pull the link out of the bot's comment
          if [ -z "$url" ]; then
            url=$(gh api "repos/$REPO/issues/$NUM/comments" --paginate \
              | jq -r '[.[] | select(.user.login == "mintlify[bot]") | .body] | last // ""' \
              | grep -oE 'https://[a-z0-9.-]+\.mintlify\.(app|site)' | head -n1 || true)
          fi

          if [ -n "$url" ]; then
            url=$(printf '%s\n' "$url" | sed -E 's#^(https://[^/]+).*#\1#')
            echo "line= · <${url}>" >> "$GITHUB_OUTPUT"
          else
            echo "line=" >> "$GITHUB_OUTPUT"
          fi

      - name: Add preview to Slack message
        if: steps.preview.outputs.line != ''
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          method: chat.update
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ vars.SLACK_CHANNEL_ID }}"
            ts: "${{ steps.post.outputs.ts }}"
            text: "Ready for review: ${{ steps.meta.outputs.title }}"
            unfurl_links: false
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: ":eyes: *<${{ github.event.pull_request.html_url }}|${{ steps.meta.outputs.title }}>*"
              - type: context
                elements:
                  - type: mrkdwn
                    text: "opened by ${{ steps.meta.outputs.author }} · `${{ github.repository }}` #${{ github.event.pull_request.number }} · +${{ github.event.pull_request.additions }}/-${{ github.event.pull_request.deletions }}${{ steps.preview.outputs.line }}"

      - name: Build changed files message
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          slack_escape() {
            sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/\\/\\\\/g; s/"/\\"/g'
          }

          files=$(gh api "repos/$REPO/pulls/$NUM/files" --paginate | jq -s 'add')
          count=$(printf '%s\n' "$files" | jq 'length')
          limit=12

          {
            echo "text<<EOF"
            if [ "$count" -eq 0 ]; then
              echo ":page_facing_up: No changed files reported by GitHub."
            elif [ "$count" -le "$limit" ]; then
              echo ":page_facing_up: *Changed files*"
              printf '%s\n' "$files" \
                | jq -r '.[] | "- `" + .filename + "` (" + .status + ")"' \
                | slack_escape
            else
              echo ":page_facing_up: *Changed files:* ${count} files changed. Showing first ${limit}."
              printf '%s\n' "$files" \
                | jq -r --argjson limit "$limit" '.[:$limit][] | "- `" + .filename + "` (" + .status + ")"' \
                | slack_escape
              printf '%s\n' "$files" \
                | jq -r --argjson limit "$limit" '"... and " + ((length - $limit) | tostring) + " more files."'
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Add changed files to Slack thread
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: "${{ vars.SLACK_CHANNEL_ID }}"
            thread_ts: "${{ steps.post.outputs.ts }}"
            text: |
              ${{ steps.files.outputs.text }}

  # ── Threaded replies: review activity and close ──
  reply:
    if: >-
      github.event.action == 'review_requested' ||
      github.event.action == 'submitted' ||
      github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Slack channel
        env:
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_USER_MAP: ${{ vars.SLACK_USER_MAP }}
        run: |
          set -euo pipefail

          if [ -z "${SLACK_CHANNEL_ID}" ]; then
            echo "::error::SLACK_CHANNEL_ID repository or organization variable is not set."
            exit 1
          fi

          case "$SLACK_CHANNEL_ID" in
            C*|G*|D*) ;;
            *)
              echo "::warning::SLACK_CHANNEL_ID should normally be a Slack channel ID, such as C... for public channels or G... for private channels, not a channel name."
              ;;
          esac

          if [ -n "${SLACK_USER_MAP}" ] && ! jq -e 'type == "object"' >/dev/null <<< "$SLACK_USER_MAP"; then
            echo "::error::SLACK_USER_MAP must be a valid JSON object."
            exit 1
          fi

      - name: Find the thread and build the message
        id: msg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.pull_request.number }}
          SLACK_USER_MAP: ${{ vars.SLACK_USER_MAP }}
        run: |
          set -euo pipefail

          slack_escape() {
            sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/\\/\\\\/g; s/"/\\"/g'
          }

          slack_user() {
            login="$1"
            slack_id=$(jq -r --arg login "$login" '.[$login] // empty' <<< "${SLACK_USER_MAP:-'{}'}")
            if [ -n "$slack_id" ]; then
              printf '<@%s>\n' "$slack_id"
            else
              printf '*%s*\n' "$(printf '%s\n' "$login" | slack_escape)"
            fi
          }

          ts=""
          for _ in $(seq 1 6); do
            ts=$(gh api "repos/$REPO/issues/$NUM/comments" --paginate \
              --jq '.[].body | try capture("slack-thread-ts:(?<ts>[0-9.]+)") catch empty | .ts' \
              | head -n1 || true)
            [ -n "$ts" ] && break
            sleep 10
          done

          # If the workflow first sees a reply event, create the parent message below.
          if [ -z "$ts" ]; then
            echo "parent_missing=true" >> "$GITHUB_OUTPUT"
          fi

          title=$(jq -r '.pull_request.title' "$GITHUB_EVENT_PATH" \
            | tr -d '\r\n' | slack_escape)
          author=$(jq -r '.pull_request.user.login' "$GITHUB_EVENT_PATH")
          action=$(jq -r '.action' "$GITHUB_EVENT_PATH")

          case "$action" in
            review_requested)
              if [ "$(jq -r '.requested_reviewer.login // empty' "$GITHUB_EVENT_PATH")" ]; then
                who=$(jq -r '.requested_reviewer.login' "$GITHUB_EVENT_PATH")
                text=":raising_hand: Review requested from $(slack_user "$who")"
              else
                who=$(jq -r '.requested_team.slug' "$GITHUB_EVENT_PATH" | slack_escape)
                text=":raising_hand: Review requested from *${who}*"
              fi
              ;;
            submitted)
              who=$(jq -r '.review.user.login' "$GITHUB_EVENT_PATH")
              case "$(jq -r '.review.state' "$GITHUB_EVENT_PATH")" in
                approved)          text=":white_check_mark: $(slack_user "$who") approved" ;;
                changes_requested) text=":warning: $(slack_user "$who") requested changes" ;;
                *)                 echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              esac
              ;;
            closed)
              approvers=""
              while IFS= read -r approver; do
                mention=$(slack_user "$approver")
                if [ -z "$approvers" ]; then
                  approvers="$mention"
                else
                  approvers="${approvers}, ${mention}"
                fi
              done < <(gh api "repos/$REPO/pulls/$NUM/reviews" --paginate \
                --jq '[.[] | select(.state=="APPROVED") | .user.login] | unique | .[]')
              if [ "$(jq -r '.pull_request.merged' "$GITHUB_EVENT_PATH")" = "true" ]; then
                by=$(jq -r '.pull_request.merged_by.login' "$GITHUB_EVENT_PATH")
                text=":large_green_circle: *Merged* by $(slack_user "$by")"
              else
                text=":red_circle: *Closed without merging*"
              fi
              [ -n "$approvers" ] && text="${text} · approved by ${approvers}"
              echo "closed=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

          {
            echo "ts=$ts"
            echo "title=$title"
            echo "author=$(slack_user "$author")"
            echo "text=$text"
          } >> "$GITHUB_OUTPUT"

      - name: Post missing parent message
        id: post_missing_parent
        if: steps.msg.outputs.parent_missing == 'true'
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: "${{ vars.SLACK_CHANNEL_ID }}"
            text: "Ready for review: ${{ steps.msg.outputs.title }}"
            unfurl_links: false
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: ":eyes: *<${{ github.event.pull_request.html_url }}|${{ steps.msg.outputs.title }}>*"
              - type: context
                elements:
                  - type: mrkdwn
                    text: "opened by ${{ steps.msg.outputs.author }} · `${{ github.repository }}` #${{ github.event.pull_request.number }} · +${{ github.event.pull_request.additions }}/-${{ github.event.pull_request.deletions }}"

      - name: Stash missing thread ts on the PR
        if: steps.msg.outputs.parent_missing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -f body="<!-- slack-thread-ts:${{ steps.post_missing_parent.outputs.ts }} -->"

      - name: Build changed files message
        id: files
        if: steps.msg.outputs.parent_missing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          slack_escape() {
            sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/\\/\\\\/g; s/"/\\"/g'
          }

          files=$(gh api "repos/$REPO/pulls/$NUM/files" --paginate | jq -s 'add')
          count=$(printf '%s\n' "$files" | jq 'length')
          limit=12

          {
            echo "text<<EOF"
            if [ "$count" -eq 0 ]; then
              echo ":page_facing_up: No changed files reported by GitHub."
            elif [ "$count" -le "$limit" ]; then
              echo ":page_facing_up: *Changed files*"
              printf '%s\n' "$files" \
                | jq -r '.[] | "- `" + .filename + "` (" + .status + ")"' \
                | slack_escape
            else
              echo ":page_facing_up: *Changed files:* ${count} files changed. Showing first ${limit}."
              printf '%s\n' "$files" \
                | jq -r --argjson limit "$limit" '.[:$limit][] | "- `" + .filename + "` (" + .status + ")"' \
                | slack_escape
              printf '%s\n' "$files" \
                | jq -r --argjson limit "$limit" '"... and " + ((length - $limit) | tostring) + " more files."'
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Add changed files to Slack thread
        if: steps.msg.outputs.parent_missing == 'true'
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: "${{ vars.SLACK_CHANNEL_ID }}"
            thread_ts: "${{ steps.post_missing_parent.outputs.ts }}"
            text: |
              ${{ steps.files.outputs.text }}

      - name: Reply in thread
        if: steps.msg.outputs.skip != 'true'
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: "${{ vars.SLACK_CHANNEL_ID }}"
            thread_ts: "${{ steps.msg.outputs.ts || steps.post_missing_parent.outputs.ts }}"
            text: "${{ steps.msg.outputs.text }}"
            reply_broadcast: false

      - name: Strike through the parent message
        if: steps.msg.outputs.closed == 'true'
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          method: chat.update
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ vars.SLACK_CHANNEL_ID }}"
            ts: "${{ steps.msg.outputs.ts || steps.post_missing_parent.outputs.ts }}"
            text: "${{ steps.msg.outputs.title }}"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "~<${{ github.event.pull_request.html_url }}|${{ steps.msg.outputs.title }}>~"
              - type: context
                elements:
                  - type: mrkdwn
                    text: "${{ steps.msg.outputs.text }} · `${{ github.repository }}` #${{ github.event.pull_request.number }}"
