<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 358" role="img" aria-label="The workload api connects to db-postgres at db-postgres.quickstart-db.cpln.local:5432 across GVCs over the internal network. The API&#x27;s identity api-identity and the database&#x27;s identity db-pg-identity both reveal the secret db-credentials, each granted by its own policy. One secret, two readers, and one database that every location writes to.">
