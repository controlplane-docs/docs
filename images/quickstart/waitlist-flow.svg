<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-labelledby="title description">
  <title id="title">Join the email waitlist</title>
  <desc id="description">A visitor joins the email waitlist on the launch page. The private API accepts the signup, and PostgreSQL stores it. The frontend and API run across AWS and GCP.</desc>
  <style>
    .box{fill:none;stroke:#8b949e;stroke-width:1.5}
    .title{fill:#1f2328;font:600 16px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .detail{fill:#57606a;font:400 13px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .icon{fill:none;stroke:#1563ff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .workload{fill:#1563ff}
    .arrow{fill:none;stroke:#8b949e;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    @media (prefers-color-scheme:dark){
      .box,.arrow{stroke:#6e7681}
      .title{fill:#e6edf3}
      .detail{fill:#9198a1}
      .icon{stroke:#64a5ef}
      .workload{fill:#64a5ef}
    }
  </style>

  <rect x="16" y="12" width="200" height="116" rx="10" class="box"/>
  <g class="icon" transform="translate(103,32)">
    <rect width="26" height="22" rx="3"/>
    <path d="M0 7h26M5 3.5h.1M9 3.5h.1M6 13h14M6 17h9"/>
  </g>
  <text x="116" y="79" text-anchor="middle" class="title">Launch page</text>
  <text x="116" y="103" text-anchor="middle" class="detail">Join the email waitlist</text>

  <path d="M225 70h26m-6-5 6 5-6 5" class="arrow"/>

  <rect x="260" y="12" width="200" height="116" rx="10" class="box"/>
  <g class="workload" transform="translate(348,31) scale(0.046866)">
    <path d="m263.085 425.468c-2.215 1.108-4.626 1.661-7.038 1.661-2.411 0-4.823-.554-7.038-1.661l-187.143-93.572-53.166 26.583c-11.599 5.8-11.599 22.353 0 28.152l240.309 120.155c4.431 2.215 9.646 2.215 14.076 0l240.309-120.155c11.599-5.8 11.599-22.353 0-28.152l-53.166-26.583z"/>
    <path d="m263.085 308.959c-2.215 1.108-4.626 1.661-7.038 1.661-2.411 0-4.823-.554-7.038-1.661l-187.143-93.571-53.166 26.583c-11.599 5.8-11.599 22.353 0 28.152l247.347 123.674 247.347-123.674c11.599-5.8 11.599-22.353 0-28.152l-53.166-26.583z"/>
    <path d="m503.394 125.462-240.309-120.155c-4.431-2.215-9.646-2.215-14.076 0l-240.309 120.155c-11.599 5.8-11.599 22.353 0 28.152l247.347 123.674 247.347-123.674c11.6-5.799 11.6-22.352 0-28.152z"/>
  </g>
  <text x="360" y="79" text-anchor="middle" class="title">Private API</text>
  <text x="360" y="103" text-anchor="middle" class="detail">Accepts the signup</text>

  <path d="M469 70h26m-6-5 6 5-6 5" class="arrow"/>

  <rect x="504" y="12" width="200" height="116" rx="10" class="box"/>
  <g class="icon" transform="translate(592,31)">
    <ellipse cx="12" cy="4" rx="11" ry="4"/>
    <path d="M1 4v16c0 2.2 4.9 4 11 4s11-1.8 11-4V4M1 12c0 2.2 4.9 4 11 4s11-1.8 11-4"/>
  </g>
  <text x="604" y="79" text-anchor="middle" class="title">PostgreSQL</text>
  <text x="604" y="103" text-anchor="middle" class="detail">Stores the signup</text>

  <text x="360" y="160" text-anchor="middle" class="detail">The frontend and API run across AWS and GCP.</text>
</svg>
