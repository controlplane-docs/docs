<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 576" role="img" aria-label="Six parts, in order. Part 1, deploy your first workload: A GVC across AWS and GCP, with your first container running. Part 2, deploy your own application: Build your frontend from source and run it as a workload. Part 3, connect two workloads: Run your API with no public endpoint, called by the frontend. Part 4, add a database and secret: Add PostgreSQL and deliver its password without exposing it. Part 5, observe your workload: Read the logs, metrics, and traces already being collected. Part 6, configure a custom domain: Point a name you own at your app, HTTPS managed for you. Part 6 is optional. The workload frontend calls the workload api, which reads and writes the workload db-postgres. frontend and api run in quickstart-gvc on AWS and GCP; db-postgres runs in quickstart-db on AWS.">
<style>
  .step{fill:none;stroke:#d8dee4;stroke-width:1.25}
  .stepo{fill:none;stroke:#8b949e;stroke-width:1.25;stroke-dasharray:6 5}
  .box{fill:none;stroke:#8b949e;stroke-width:1.5}
  .num{fill:#1563ff}
  .numt{fill:#ffffff;font:700 14px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .ico{fill:#57606a}
  .title{fill:#1f2328;font:600 15px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .desc{fill:#57606a;font:400 13px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .badge{fill:#1563ff}
  .badget{fill:#ffffff;font:700 11px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:1.1px}
  .rule{stroke:#d8dee4;stroke-width:1}
  .h2{fill:#1f2328;font:700 14.5px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .val{fill:#1f2328;font:600 14px SFMono-Regular,Menlo,Consolas,monospace}
  .sub{fill:#57606a;font:400 13px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .line{stroke:#8b949e;stroke-width:1.5;fill:none}
  .head{fill:#8b949e}
  @media (prefers-color-scheme:dark){
    .step{stroke:#30363d}
    .stepo,.box{stroke:#6e7681}
    .ico{fill:#9198a1}
    .title,.h2,.val{fill:#e6edf3}
    .desc,.sub{fill:#9198a1}
    .rule{stroke:#30363d}
    .line{stroke:#6e7681}
    .head{fill:#6e7681}
  }
</style>
