<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 408" role="img" aria-label="A user&#x27;s browser reaches the domain example.com, which routes to the workload frontend, which calls the workload api, which connects to the workload db-postgres. frontend and api run in the GVC quickstart-gvc spanning AWS and GCP; db-postgres runs in the GVC quickstart-db on AWS. The secret db-credentials is read by api and db-postgres, and logs, metrics, and traces are collected for every workload. Six parts, one system: a frontend, an API, and a database, observed end to end.">
