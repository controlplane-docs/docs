<text x="610.0" y="109" class="val" text-anchor="middle">frontend</text>
<text x="110" y="148" class="sub" text-anchor="middle">your Next.js application,</text>
<text x="110" y="164" class="sub" text-anchor="middle">built with cpln image build</text>
