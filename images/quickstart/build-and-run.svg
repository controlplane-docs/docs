<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 222" role="img" aria-label="The source folder frontend is built into the image frontend:1.0 in the org&#x27;s private registry, and the image runs as the workload frontend. One build into your registry, and a workload that runs it in every location.">
<style>
  .box{fill:none;stroke:#8b949e;stroke-width:1.5}
  .lbl{fill:#57606a;font:600 10.5px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:1.4px}
