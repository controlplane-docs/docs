<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 358" role="img" aria-label="A POST from your browser gets an id at the frontend, whose sidecar logs the request in and the call out and starts the trace; the frontend calls the api with POST /signups under the same id and the same trace, and the api&#x27;s sidecar logs the call in and adds its span. Control Plane collects logs, metrics, and traces from both. One request id in every log line, and one trace across both workloads.">
<style>
  .box{fill:none;stroke:#8b949e;stroke-width:1.5}
  .lbl{fill:#57606a;font:600 10.5px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:1.4px}
  .kind{fill:#57606a;font:400 11px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .val{fill:#1f2328;font:600 13px SFMono-Regular,Menlo,Consolas,monospace}
  .vals{fill:#1f2328;font:600 12px SFMono-Regular,Menlo,Consolas,monospace}
  .sub{fill:#57606a;font:400 11.5px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .sum{fill:#1f2328;font:600 13px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .chp{fill:#1563ff;font:600 10.5px SFMono-Regular,Menlo,Consolas,monospace}
  .chipbox{fill:none;stroke:#1563ff;stroke-width:1.25}
  .line{stroke:#8b949e;stroke-width:1.5;fill:none}
  .head{fill:#8b949e}
  .ico{fill:#57606a}
  .icop{fill:#1563ff}
  .pulse{stroke:#57606a;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .awsl{fill:#1f2328}
  .badge{fill:#1563ff}
  .badget{fill:#ffffff;font:700 11px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme:dark){
    .box{stroke:#6e7681}
    .lbl,.kind,.sub{fill:#9198a1}
    .val,.vals,.sum{fill:#e6edf3}
    .chp{fill:#64a5ef}
    .chipbox{stroke:#64a5ef}
    .line{stroke:#6e7681}
    .head{fill:#6e7681}
    .ico{fill:#9198a1}
    .pulse{stroke:#9198a1}
    .icop{fill:#64a5ef}
    .awsl{fill:#e6edf3}
  }
</style>
