<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 246" role="img" aria-label="Inside the GVC quickstart-gvc, the workload frontend calls the workload api at api.quickstart-gvc.cpln.local:8080 over the internal network, encrypted by the mesh. frontend keeps its public endpoint and api has none, and api admits frontend by name on its internal firewall. Two workloads talk inside the GVC; the API answers only the callers its firewall names.">
