<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="Four principal types, users, groups, service accounts, and identities, are bound by a policy to permissions on target resources. A workload reads a secret through the identity attached to it.">
<style>
  .box{fill:none;stroke:#8b949e;stroke-width:1.5}
  .accent{stroke:#1563ff;stroke-width:1.75}
  .ttl{fill:#1f2328;font:600 14px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .sub{fill:#57606a;font:400 11.5px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .chp{fill:#1563ff;font:600 10.5px SFMono-Regular,Menlo,Consolas,monospace}
  .chipbox{fill:none;stroke:#1563ff;stroke-width:1.25}
  .ico{fill:none;stroke:#57606a;stroke-width:1.4}
  .line{stroke:#8b949e;stroke-width:1.5;fill:none;stroke-opacity:.75}
  @media (prefers-color-scheme:dark){
    .box,.line{stroke:#6e7681}
    .accent,.chipbox{stroke:#64a5ef}
    .ttl{fill:#e6edf3}
    .sub{fill:#9198a1}
    .chp{fill:#64a5ef}
    .ico{stroke:#9198a1}
  }
</style>
<text x="94" y="14" class="sub" text-anchor="middle">Principals</text>
<rect x="4" y="22" width="180" height="44" rx="7" class="box"/><text x="94" y="49" class="ttl" text-anchor="middle">User</text>
<rect x="4" y="70" width="180" height="44" rx="7" class="box"/><text x="94" y="97" class="ttl" text-anchor="middle">Group</text>
<rect x="4" y="118" width="180" height="44" rx="7" class="box"/><text x="94" y="145" class="ttl" text-anchor="middle">Service account</text>
<rect x="4" y="166" width="180" height="44" rx="7" class="box accent"/><text x="94" y="193" class="ttl" text-anchor="middle">Identity</text>

<path class="line" d="M184 44 H224"/>
<path class="line" d="M184 92 H224"/>
<path class="line" d="M184 140 H224"/>
<path class="line" d="M184 188 H224"/>
<path class="line" d="M224 44 V188"/>
<path class="line" d="M224 116 H264"/>

<rect x="264" y="60" width="176" height="112" rx="8" class="box accent"/>
<text x="352" y="98" class="ttl" text-anchor="middle">Policy</text>
<text x="352" y="120" class="sub" text-anchor="middle">Binds principals to</text>
<text x="352" y="136" class="sub" text-anchor="middle">permissions</text>

<path class="line" d="M440 116 H520"/>

<rect x="520" y="60" width="196" height="112" rx="8" class="box"/>
<text x="618" y="98" class="ttl" text-anchor="middle">Target resources</text>
<text x="618" y="120" class="sub" text-anchor="middle">GVCs, workloads, secrets,</text>
<text x="618" y="136" class="sub" text-anchor="middle">domains, and every kind</text>

<text x="360" y="230" class="sub" text-anchor="middle">A policy can target every resource of a kind, named resources, or whatever a query matches</text>
</svg>
