<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 216" role="img" aria-label="A policy is one sentence with three parts. WHO, shown as the service account ci-deploy, can do WHAT, shown as the permission edit, on WHICH resource, shown as the workload my-app. Underneath each part, the alternatives: WHO can be a user, a group, a service account, or a workload's identity; WHAT can be view, edit, manage, or another permission depending on the resource kind; WHICH can be a workload, a secret, a GVC, or any other resource kind. You write all three in one policy, and nothing is allowed unless a policy grants it.">
<style>
  .box{fill:none;stroke:#8b949e;stroke-width:1.5}
  .lbl{fill:#57606a;font:600 10.5px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:1.4px}
  .kind{fill:#57606a;font:400 11px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .val{fill:#1f2328;font:600 13px SFMono-Regular,Menlo,Consolas,monospace}
  .sub{fill:#57606a;font:400 11.5px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .sum{fill:#1f2328;font:600 13px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .chip{fill:none;stroke:#1563ff;stroke-width:1.5}
  .chipv{fill:#1563ff;font:600 13px SFMono-Regular,Menlo,Consolas,monospace}
  .line{stroke:#8b949e;stroke-width:1.5;fill:none}
  .head{fill:#8b949e}
  .ico{fill:#8b949e}
  .icop{fill:#1563ff}
  @media (prefers-color-scheme:dark){
    .box{stroke:#6e7681}
    .lbl,.kind,.sub{fill:#9198a1}
    .val,.sum{fill:#e6edf3}
    .chip{stroke:#64a5ef}
    .chipv{fill:#64a5ef}
    .line{stroke:#6e7681}
    .head,.ico{fill:#6e7681}
    .icop{fill:#64a5ef}
  }
</style>

