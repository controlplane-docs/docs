<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 348" role="img" aria-label="The shape you know: a provider region, us-east-1, marked with the AWS logo, contains availability zones us-east-1a, us-east-1b, and us-east-1c. The same shape, one level up, drawn larger: a GVC, my-gvc, contains five locations across the world: aws-us-east-1 with the AWS logo, gcp-southamerica-east1 with the Google Cloud logo, azure-westeurope with the Azure logo, oci-il-jerusalem-1 with the Oracle logo, and my-hardware, your own machines, marked with a server tower. The difference: a region's zones are fixed, while you choose and change what a GVC spans.">
<style>
  .box{fill:none;stroke:#8b949e;stroke-width:1.5}
  .lbl{fill:#57606a;font:600 10.5px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:1.4px}
  .kind{fill:#57606a;font:400 11px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .val{fill:#1f2328;font:600 13px SFMono-Regular,Menlo,Consolas,monospace}
  .sub{fill:#57606a;font:400 11.5px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .sum{fill:#1f2328;font:600 13px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .line{stroke:#8b949e;stroke-width:1.5;fill:none}
  .head{fill:#8b949e}
  .ico{fill:#8b949e}
  .icop{fill:#1563ff}
  .awsl{fill:#1f2328}
  @media (prefers-color-scheme:dark){
    .box{stroke:#6e7681}
    .lbl,.kind,.sub{fill:#9198a1}
    .val,.sum{fill:#e6edf3}
    .line{stroke:#6e7681}
    .head,.ico{fill:#6e7681}
    .icop{fill:#64a5ef}
    .awsl{fill:#e6edf3}
  }
</style>

