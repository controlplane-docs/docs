<rect x="250" y="4" width="220" height="84" rx="8" class="box"/>
<use href="#ico-work" class="ico" x="268" y="18" width="18" height="18"/>
<text x="294" y="33" class="ttl">Other workloads</text>
<text x="268" y="54" class="sub">Denied by default; allow by</text>
<text x="268" y="70" class="sub">GVC, org, or workload list</text>

<rect x="8" y="112" width="232" height="84" rx="8" class="box"/>
<use href="#ico-agent" class="ico" x="26" y="126" width="18" height="18"/>
<text x="52" y="141" class="ttl">Private networks</text>
<text x="26" y="162" class="sub">A VPC, data center, or laptop,</text>
<text x="26" y="178" class="sub">reached through a wormhole agent</text>

<rect x="270" y="112" width="180" height="84" rx="8" class="box accent"/>
<use href="#ico-work" class="ico-a" x="288" y="126" width="18" height="18"/>
<text x="314" y="141" class="ttl">Workload</text>
<text x="288" y="162" class="sub">Mutual TLS on every</text>
<text x="288" y="178" class="sub">connection it makes</text>

<rect x="480" y="112" width="232" height="84" rx="8" class="box"/>
<use href="#ico-cloud" class="ico" x="498" y="126" width="18" height="18"/>
<text x="524" y="141" class="ttl">Cloud services</text>
<text x="498" y="162" class="sub">AWS, GCP, Azure, and NATS NGS,</text>
<text x="498" y="178" class="sub">with no stored credentials</text>

<rect x="250" y="228" width="220" height="84" rx="8" class="box"/>
<use href="#ico-globe" class="ico-s" x="268" y="242" width="18" height="18"/>
<text x="294" y="257" class="ttl">The Internet</text>
<text x="268" y="278" class="sub">Inbound denied by default;</text>
<text x="268" y="294" class="sub">allow by CIDR, host, or header</text>

