<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="A workload connects in four directions: to other workloads, to the Internet, to private networks through a wormhole agent, and to cloud services with no stored credentials. Inbound access is denied by default in every direction, and every connection uses mutual TLS.">
<style>
  .box{fill:none;stroke:#8b949e;stroke-width:1.5}
  .accent{stroke:#1563ff;stroke-width:1.75}
  .ttl{fill:#1f2328;font:600 14px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .sub{fill:#57606a;font:400 11.5px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .line{stroke:#8b949e;stroke-width:1.5;fill:none;stroke-opacity:.75}
  .ico{fill:#8b949e}
  .ico-a{fill:#1563ff}
  .ico-s{fill:none;stroke:#8b949e;stroke-width:1.6;stroke-linecap:round}
  @media (prefers-color-scheme:dark){
    .box,.line{stroke:#6e7681}
    .accent{stroke:#64a5ef}
    .ttl{fill:#e6edf3}
    .sub{fill:#9198a1}
    .ico{fill:#6e7681}
    .ico-a{fill:#64a5ef}
    .ico-s{stroke:#6e7681}
  }
</style>
