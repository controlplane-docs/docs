<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 278" role="img" aria-label="A workload has one identity attached to it, and that identity is its route out. The workload my-app uses the identity my-identity. Arrows labeled reaches fan out from the identity to four destinations: the secret my-db-password, the cloud service s3://my-bucket marked with the Amazon S3 logo, the private host db.internal, and the VPC service payments.internal. A workload takes one identity, and that identity holds everything the workload may reach.">
<style>
  .box{fill:none;stroke:#8b949e;stroke-width:1.5}
  .lbl{fill:#57606a;font:600 10.5px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:1.4px}
  .kind{fill:#57606a;font:400 11px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .val{fill:#1f2328;font:600 13px SFMono-Regular,Menlo,Consolas,monospace}
  .sum{fill:#1f2328;font:600 13px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .line{stroke:#8b949e;stroke-width:1.5;fill:none}
  .head{fill:#8b949e}
  .ico{fill:#8b949e}
  .icop{fill:#1563ff}
  @media (prefers-color-scheme:dark){
    .box{stroke:#6e7681}
    .lbl,.kind{fill:#9198a1}
    .val,.sum{fill:#e6edf3}
    .line{stroke:#6e7681}
    .head,.ico{fill:#6e7681}
    .icop{fill:#64a5ef}
  }
</style>

