<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" role="img" aria-label="Two link shapes. A GVC-scoped item, read left to right: the org /org/my-org, the GVC /gvc/my-gvc, then the kind and name /workload/my-app. Everything you create belongs to one org. The GVC part is only for workloads, identities, and volume sets. The kind, then a name that never changes. An org-scoped item has two parts: the org /org/my-org, then the kind and name /secret/my-secret. Three parts for a GVC-scoped item, two for an org-scoped one.">
<style>
  .box{fill:none;stroke:#8b949e;stroke-width:1.5}
