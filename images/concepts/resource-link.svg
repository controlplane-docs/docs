  .sum{fill:#1f2328;font:600 13px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .line{stroke:#8b949e;stroke-width:1.5;fill:none}
  .ico{fill:#57606a}
  .icop{fill:#1563ff}
  @media (prefers-color-scheme:dark){
    .box{stroke:#6e7681}
    .lbl,.sub{fill:#9198a1}
    .val,.sum{fill:#e6edf3}
    .line{stroke:#6e7681}
    .ico{fill:#9198a1}
    .icop{fill:#64a5ef}
  }
</style>

