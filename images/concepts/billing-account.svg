<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 222" role="img" aria-label="Billing users manage the account, and the account pays for the orgs. A billing user, finance@example.com, holds billing_admin, billing_viewer, or org_creator. An arrow labeled manage points to the billing account, my-account, which holds the payment method, invoices, spend alert, and audit trail. Arrows labeled pays for fan out from the account to two orgs, staging and production. Each org bills to exactly one account, up to the account's org quota. You add billing users by email. Access inside an org comes from policies, not billing roles.">
<style>
  .box{fill:none;stroke:#8b949e;stroke-width:1.5}
  .lbl{fill:#57606a;font:600 10.5px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:1.4px}
  .kind{fill:#57606a;font:400 11px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .val{fill:#1f2328;font:600 13px SFMono-Regular,Menlo,Consolas,monospace}
  .sub{fill:#57606a;font:400 11.5px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .sum{fill:#1f2328;font:600 13px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .line{stroke:#8b949e;stroke-width:1.5;fill:none}
  .head{fill:#8b949e}
  .ico{fill:#8b949e}
  .icop{fill:#1563ff}
  @media (prefers-color-scheme:dark){
    .box{stroke:#6e7681}
    .lbl,.kind,.sub{fill:#9198a1}
    .val,.sum{fill:#e6edf3}
    .line{stroke:#6e7681}
    .head,.ico{fill:#6e7681}
    .icop{fill:#64a5ef}
  }
</style>

<text x="110" y="22" class="lbl" text-anchor="middle">BILLING USERS</text>
<text x="360" y="22" class="lbl" text-anchor="middle">THE ACCOUNT</text>
<text x="610" y="22" class="lbl" text-anchor="middle">THE ORGS</text>

<rect x="20" y="36" width="180" height="90" rx="8" class="box"/>
<g class="ico" transform="translate(101,49) scale(0.75)"><path d="M12 11.6a4.8 4.8 0 1 0-4.8-4.8A4.806 4.806 0 0 0 12 11.6ZM12 14c-4.97 0-9 2.58-9 5.77v0.73A1.5 1.5 0 0 0 4.5 22h15a1.5 1.5 0 0 0 1.5-1.5v-0.73c0-3.19-4.03-5.77-9-5.77Z"/></g>
