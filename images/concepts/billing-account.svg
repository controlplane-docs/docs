<text x="627" y="51" class="kind" text-anchor="middle">org</text>
<text x="627" y="69" class="val" text-anchor="middle">staging</text>

<rect x="520" y="84" width="180" height="42" rx="8" class="box"/>
<g class="ico" transform="translate(536,96) scale(0.035156)"><path d="M472.019,365.888h-14.903v-18.818c0-44.556-36.249-80.803-80.804-80.803H274.35v-69.593h44.7c22.045,0,39.98-17.935,39.98-39.981V59.645c0-22.045-17.935-39.981-39.98-39.981H199.623c-22.045,0-39.98,17.935-39.98,39.981v97.047c0,22.045,17.935,39.981,39.98,39.981h44.7v69.593H136.354c-44.556,0-80.803,36.248-80.803,80.803v18.818h-15.57C17.935,365.888,0,383.823,0,405.869v46.486c0,22.045,17.935,39.98,39.981,39.98h61.166c22.045,0,39.98-17.935,39.98-39.98v-46.486c0-22.046-17.935-39.981-39.98-39.981H85.578v-18.818c0-27.997,22.778-50.775,50.775-50.775h107.969v69.593h-15.569c-22.046,0-39.981,17.935-39.981,39.981v46.486c0,22.045,17.935,39.98,39.981,39.98h61.166c22.045,0,39.98-17.935,39.98-39.98v-46.486c0-22.046-17.935-39.981-39.98-39.981H274.35v-69.593h101.963c27.998,0,50.776,22.778,50.776,50.775v18.818h-16.237c-22.045,0-39.98,17.935-39.98,39.981v46.486c0,22.045,17.935,39.98,39.98,39.98h61.166c22.046,0,39.981-17.935,39.981-39.98v-46.486C512,383.823,494.065,365.888,472.019,365.888z"/></g>
<text x="627" y="99" class="kind" text-anchor="middle">org</text>
<text x="627" y="117" class="val" text-anchor="middle">production</text>

<text x="110" y="148" class="sub" text-anchor="middle">holds billing_admin, billing_viewer,</text>
<text x="110" y="164" class="sub" text-anchor="middle">or org_creator</text>
<text x="360" y="148" class="sub" text-anchor="middle">the payment method, invoices,</text>
<text x="360" y="164" class="sub" text-anchor="middle">spend alert, and audit trail</text>
<text x="610" y="148" class="sub" text-anchor="middle">each bills to exactly one account,</text>
<text x="610" y="164" class="sub" text-anchor="middle">up to the account's org quota</text>

