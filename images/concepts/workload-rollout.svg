<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="The same workload, my-app, at two moments. While the update rolls out, version 6 is ready and serving and version 7 rolls out beside it, not ready. When the update reports ready, only version 7 remains, in a smaller box. The live version keeps serving while the update rolls out, then traffic switches over, and the old version drains. The workload keeps serving through every update, even a broken one.">
<style>
  .box{fill:none;stroke:#8b949e;stroke-width:1.5}
  .lbl{fill:#57606a;font:600 10.5px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:1.4px}
  .kind{fill:#57606a;font:400 11px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .val{fill:#1f2328;font:600 13px SFMono-Regular,Menlo,Consolas,monospace}
  .sub{fill:#57606a;font:400 11.5px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .sum{fill:#1f2328;font:600 13px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .line{stroke:#8b949e;stroke-width:1.5;fill:none}
  .head{fill:#8b949e}
  .ico{fill:#8b949e}
  .icop{fill:#1563ff}
  @media (prefers-color-scheme:dark){
    .box{stroke:#6e7681}
    .lbl,.kind,.sub{fill:#9198a1}
    .val,.sum{fill:#e6edf3}
    .line{stroke:#6e7681}
    .head,.ico{fill:#6e7681}
    .icop{fill:#64a5ef}
  }
</style>

<text x="204" y="22" class="lbl" text-anchor="middle">THE UPDATE ROLLS OUT</text>
<text x="516" y="22" class="lbl" text-anchor="middle">THE UPDATE REPORTS READY</text>

<rect x="90" y="36" width="228" height="168" rx="8" class="box"/>
<g class="ico" transform="translate(106,50) scale(0.035156)"><path d="m263.085 425.468c-2.215 1.108-4.626 1.661-7.038 1.661-2.411 0-4.823-.554-7.038-1.661l-187.143-93.572-53.166 26.583c-11.599 5.8-11.599 22.353 0 28.152l240.309 120.155c4.431 2.215 9.646 2.215 14.076 0l240.309-120.155c11.599-5.8 11.599-22.353 0-28.152l-53.166-26.583z"/><path d="m263.085 308.959c-2.215 1.108-4.626 1.661-7.038 1.661-2.411 0-4.823-.554-7.038-1.661l-187.143-93.571-53.166 26.583c-11.599 5.8-11.599 22.353 0 28.152l247.347 123.674 247.347-123.674c11.599-5.8 11.599-22.353 0-28.152l-53.166-26.583z"/><path d="m503.394 125.462-240.309-120.155c-4.431-2.215-9.646-2.215-14.076 0l-240.309 120.155c-11.599 5.8-11.599 22.353 0 28.152l247.347 123.674 247.347-123.674c11.6-5.799 11.6-22.352 0-28.152z"/></g>
<text x="132" y="58" class="kind">workload</text>
<text x="132" y="75" class="val">my-app</text>

<rect x="104" y="94" width="200" height="44" rx="7" class="box"/>
<g class="ico" transform="translate(120,107) scale(0.75)"><path fill-rule="evenodd" d="M3 5.5 H13.5 L21 12 L13.5 18.5 H3 Z M7.5 10.4 a1.6 1.6 0 1 0 0 3.2 a1.6 1.6 0 1 0 0 -3.2 Z"/></g>
<text x="150" y="110" class="kind">ready, serving</text>
<text x="150" y="126" class="val">v6</text>

<rect x="104" y="146" width="200" height="44" rx="7" class="box"/>
<g class="ico" transform="translate(120,159) scale(0.75)"><path fill-rule="evenodd" d="M3 5.5 H13.5 L21 12 L13.5 18.5 H3 Z M7.5 10.4 a1.6 1.6 0 1 0 0 3.2 a1.6 1.6 0 1 0 0 -3.2 Z"/></g>
<text x="150" y="162" class="kind">rolling out, not ready</text>
<text x="150" y="178" class="val">v7</text>

<path class="line" d="M332 120 H384"/>
<path class="head" d="M394 120 L384 115 L384 125 Z"/>

<rect x="402" y="62" width="228" height="116" rx="8" class="box"/>
<g class="ico" transform="translate(418,76) scale(0.035156)"><path d="m263.085 425.468c-2.215 1.108-4.626 1.661-7.038 1.661-2.411 0-4.823-.554-7.038-1.661l-187.143-93.572-53.166 26.583c-11.599 5.8-11.599 22.353 0 28.152l240.309 120.155c4.431 2.215 9.646 2.215 14.076 0l240.309-120.155c11.599-5.8 11.599-22.353 0-28.152l-53.166-26.583z"/><path d="m263.085 308.959c-2.215 1.108-4.626 1.661-7.038 1.661-2.411 0-4.823-.554-7.038-1.661l-187.143-93.571-53.166 26.583c-11.599 5.8-11.599 22.353 0 28.152l247.347 123.674 247.347-123.674c11.599-5.8 11.599-22.353 0-28.152l-53.166-26.583z"/><path d="m503.394 125.462-240.309-120.155c-4.431-2.215-9.646-2.215-14.076 0l-240.309 120.155c-11.599 5.8-11.599 22.353 0 28.152l247.347 123.674 247.347-123.674c11.6-5.799 11.6-22.352 0-28.152z"/></g>
<text x="444" y="84" class="kind">workload</text>
<text x="444" y="101" class="val">my-app</text>

<rect x="416" y="120" width="200" height="44" rx="7" class="box"/>
<g class="ico" transform="translate(432,133) scale(0.75)"><path fill-rule="evenodd" d="M3 5.5 H13.5 L21 12 L13.5 18.5 H3 Z M7.5 10.4 a1.6 1.6 0 1 0 0 3.2 a1.6 1.6 0 1 0 0 -3.2 Z"/></g>
<text x="462" y="136" class="kind">ready, serving</text>
<text x="462" y="152" class="val">v7</text>

<text x="360" y="228" class="sub" text-anchor="middle">the live version keeps serving while the update rolls out,</text>
<text x="360" y="244" class="sub" text-anchor="middle">then traffic switches over, and the old version drains</text>

<g class="icop" id="sumicon" transform="translate(130,272) scale(0.03125)"><path d="m263.085 425.468c-2.215 1.108-4.626 1.661-7.038 1.661-2.411 0-4.823-.554-7.038-1.661l-187.143-93.572-53.166 26.583c-11.599 5.8-11.599 22.353 0 28.152l240.309 120.155c4.431 2.215 9.646 2.215 14.076 0l240.309-120.155c11.599-5.8 11.599-22.353 0-28.152l-53.166-26.583z"/><path d="m263.085 308.959c-2.215 1.108-4.626 1.661-7.038 1.661-2.411 0-4.823-.554-7.038-1.661l-187.143-93.571-53.166 26.583c-11.599 5.8-11.599 22.353 0 28.152l247.347 123.674 247.347-123.674c11.599-5.8 11.599-22.353 0-28.152l-53.166-26.583z"/><path d="m503.394 125.462-240.309-120.155c-4.431-2.215-9.646-2.215-14.076 0l-240.309 120.155c-11.599 5.8-11.599 22.353 0 28.152l247.347 123.674 247.347-123.674c11.6-5.799 11.6-22.352 0-28.152z"/></g>
<text id="sum" x="154" y="285" class="sum">The workload keeps serving through every update, even a broken one.</text>
</svg>
