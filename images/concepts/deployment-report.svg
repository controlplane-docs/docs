<g class="pulse" transform="translate(396,148) scale(0.75)"><path d="M2.5 13 H7 L10.3 5.5 L13.9 19 L16.7 13 H21.5"/></g>
<text x="517" y="151" class="kind" text-anchor="middle">deployment</text>
<text x="517" y="169" class="val" text-anchor="middle">my-hardware</text>

<text x="360" y="206" class="sub" text-anchor="middle">each deployment is named after its location and reports what runs there:</text>
<text x="360" y="222" class="sub" text-anchor="middle">the versions present, the ready replicas of each, and that location's endpoint</text>

<g class="pulsep" id="sumicon" transform="translate(80.51,250) scale(0.75)"><path d="M2.5 13 H7 L10.3 5.5 L13.9 19 L16.7 13 H21.5"/></g>
<text id="sum" x="104.51" y="263" class="sum">One workload, three locations, three deployments, every one written by Control Plane.</text>
</svg>
