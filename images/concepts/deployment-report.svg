<g class="pulse" transform="translate(396,48) scale(0.75)"><path d="M2.5 13 H7 L10.3 5.5 L13.9 19 L16.7 13 H21.5"/></g>
<text x="517" y="51" class="kind" text-anchor="middle">deployment</text>
<text x="517" y="69" class="val" text-anchor="middle">aws-us-east-1</text>

<rect x="380" y="86" width="240" height="42" rx="8" class="box"/>
<g class="pulse" transform="translate(396,98) scale(0.75)"><path d="M2.5 13 H7 L10.3 5.5 L13.9 19 L16.7 13 H21.5"/></g>
<text x="517" y="101" class="kind" text-anchor="middle">deployment</text>
<text x="517" y="119" class="val" text-anchor="middle">gcp-us-central1</text>

