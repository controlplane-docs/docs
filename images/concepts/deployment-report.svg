<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="The workload you create and edit, my-app, on the left. An arrow labeled one per location fans out to three deployments Control Plane reports back: aws-us-east-1, gcp-us-central1, and my-hardware. Each deployment is named after its location and reports what runs there: the versions present, the ready replicas of each, and that location's endpoint. One workload, three locations, three deployments, every one written by Control Plane.">
<style>
  .box{fill:none;stroke:#8b949e;stroke-width:1.5}
  .lbl{fill:#57606a;font:600 10.5px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:1.4px}
  .kind{fill:#57606a;font:400 11px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .val{fill:#1f2328;font:600 13px SFMono-Regular,Menlo,Consolas,monospace}
  .sub{fill:#57606a;font:400 11.5px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .sum{fill:#1f2328;font:600 13px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .line{stroke:#8b949e;stroke-width:1.5;fill:none}
  .head{fill:#8b949e}
  .ico{fill:#57606a}
  .icop{fill:#1563ff}
  .pulse{stroke:#57606a;stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
  .pulsep{stroke:#1563ff;stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
  @media (prefers-color-scheme:dark){
    .box{stroke:#6e7681}
    .lbl,.kind,.sub{fill:#9198a1}
    .val,.sum{fill:#e6edf3}
    .line{stroke:#6e7681}
    .head{fill:#6e7681}
    .ico{fill:#9198a1}
    .icop{fill:#64a5ef}
  }
</style>

<text x="190" y="22" class="lbl" text-anchor="middle">WHAT YOU CREATE AND EDIT</text>
<text x="500" y="22" class="lbl" text-anchor="middle">WHAT CONTROL PLANE REPORTS BACK</text>

<rect x="110" y="62" width="160" height="90" rx="8" class="box"/>
<g class="ico" transform="translate(181,81) scale(0.035156)"><g>
  <path d="m263.085 425.468c-2.215 1.108-4.626 1.661-7.038 1.661-2.411 0-4.823-.554-7.038-1.661l-187.143-93.572-53.166 26.583c-11.599 5.8-11.599 22.353 0 28.152l240.309 120.155c4.431 2.215 9.646 2.215 14.076 0l240.309-120.155c11.599-5.8 11.599-22.353 0-28.152l-53.166-26.583z"/>
  <path d="m263.085 308.959c-2.215 1.108-4.626 1.661-7.038 1.661-2.411 0-4.823-.554-7.038-1.661l-187.143-93.571-53.166 26.583c-11.599 5.8-11.599 22.353 0 28.152l247.347 123.674 247.347-123.674c11.599-5.8 11.599-22.353 0-28.152l-53.166-26.583z"/>
  <path d="m503.394 125.462-240.309-120.155c-4.431-2.215-9.646-2.215-14.076 0l-240.309 120.155c-11.599 5.8-11.599 22.353 0 28.152l247.347 123.674 247.347-123.674c11.6-5.799 11.6-22.352 0-28.152z"/>
</g></g>
<text x="190" y="117" class="kind" text-anchor="middle">workload</text>
<text x="190" y="135" class="val" text-anchor="middle">my-app</text>

<text x="330" y="48" class="kind" text-anchor="middle">one per location</text>
<path class="line" d="M270 107 H330"/>
<path class="line" d="M330 57 V157"/>
<path class="line" d="M330 57 H363"/><path class="head" d="M373 57 L363 52 L363 62 Z"/>
<path class="line" d="M330 107 H363"/><path class="head" d="M373 107 L363 102 L363 112 Z"/>
<path class="line" d="M330 157 H363"/><path class="head" d="M373 157 L363 152 L363 162 Z"/>

