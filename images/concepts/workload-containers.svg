<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img" aria-label="A workload, my-app, drawn as one box holding two containers, app and sidecar, which reach each other over localhost. Up to eight containers in one workload: they deploy, scale, and stop together. The endpoint, the firewall, and the identity belong to the whole workload.">
<style>
  .box{fill:none;stroke:#8b949e;stroke-width:1.5}
  .kind{fill:#57606a;font:400 11px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .val{fill:#1f2328;font:600 13px SFMono-Regular,Menlo,Consolas,monospace}
  .sub{fill:#57606a;font:400 11.5px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .sum{fill:#1f2328;font:600 13px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .line{stroke:#8b949e;stroke-width:1.5;fill:none}
  .head{fill:#8b949e}
  .ico{fill:#8b949e}
  .icop{fill:#1563ff}
  @media (prefers-color-scheme:dark){
    .box{stroke:#6e7681}
    .kind,.sub{fill:#9198a1}
    .val,.sum{fill:#e6edf3}
    .line{stroke:#6e7681}
    .head,.ico{fill:#6e7681}
    .icop{fill:#64a5ef}
  }
</style>

<rect x="136" y="20" width="448" height="118" rx="8" class="box"/>
<g class="ico" transform="translate(152,34) scale(0.035156)"><path d="m263.085 425.468c-2.215 1.108-4.626 1.661-7.038 1.661-2.411 0-4.823-.554-7.038-1.661l-187.143-93.572-53.166 26.583c-11.599 5.8-11.599 22.353 0 28.152l240.309 120.155c4.431 2.215 9.646 2.215 14.076 0l240.309-120.155c11.599-5.8 11.599-22.353 0-28.152l-53.166-26.583z"/><path d="m263.085 308.959c-2.215 1.108-4.626 1.661-7.038 1.661-2.411 0-4.823-.554-7.038-1.661l-187.143-93.571-53.166 26.583c-11.599 5.8-11.599 22.353 0 28.152l247.347 123.674 247.347-123.674c11.599-5.8 11.599-22.353 0-28.152l-53.166-26.583z"/><path d="m503.394 125.462-240.309-120.155c-4.431-2.215-9.646-2.215-14.076 0l-240.309 120.155c-11.599 5.8-11.599 22.353 0 28.152l247.347 123.674 247.347-123.674c11.6-5.799 11.6-22.352 0-28.152z"/></g>
<text x="178" y="42" class="kind">workload</text>
<text x="178" y="59" class="val">my-app</text>

<rect x="150" y="78" width="160" height="44" rx="7" class="box"/>
<g class="ico" transform="translate(166,91) scale(0.75)"><path d="M12 2.2 L20.8 7.2 L12 12.2 L3.2 7.2 Z"/><path d="M3.2 9 L11.2 13.55 L11.2 21.8 L3.2 17.25 Z"/><path d="M20.8 9 L12.8 13.55 L12.8 21.8 L20.8 17.25 Z"/></g>
<text x="196" y="94" class="kind">container</text>
<text x="196" y="110" class="val">app</text>

<rect x="410" y="78" width="160" height="44" rx="7" class="box"/>
<g class="ico" transform="translate(426,91) scale(0.75)"><path d="M12 2.2 L20.8 7.2 L12 12.2 L3.2 7.2 Z"/><path d="M3.2 9 L11.2 13.55 L11.2 21.8 L3.2 17.25 Z"/><path d="M20.8 9 L12.8 13.55 L12.8 21.8 L20.8 17.25 Z"/></g>
<text x="456" y="94" class="kind">container</text>
<text x="456" y="110" class="val">sidecar</text>

<text x="360" y="90" class="val" text-anchor="middle">localhost</text>
<path class="head" d="M316 100 L326 95 L326 105 Z"/>
<path class="line" d="M326 100 H394"/>
<path class="head" d="M404 100 L394 95 L394 105 Z"/>

<text x="360" y="162" class="sub" text-anchor="middle">up to eight containers in one workload:</text>
<text x="360" y="178" class="sub" text-anchor="middle">they deploy, scale, and stop together</text>

